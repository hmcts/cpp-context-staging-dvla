# One source of truth for the Azurite (Azure Storage emulator) connection string used by
# this IT suite's Azure blob assertions (see AzuriteFixture, DvlaNotificationIT,
# QueryDrivingLicencesIT). Provisioned by the cpp-developers-docker "azurite" profile
# (see ../../../runIntegrationTests.sh); these ITs run on the host JVM, which reaches it
# via the published localhost:10000 port rather than the in-network "cpp-azurite"
# hostname WildFly uses.
#
# The AccountKey below is the well-known, publicly documented Microsoft Azurite emulator
# key; it cannot authenticate against real Azure Storage, so it is not a secret. The
# trailing "# gitleaks:allow" tells this repo's gitleaks-based secret scanner
# (.github/workflows/secret-scanning.yml) that this specific match is an intentional
# public fixture, not a leak - same pattern used in cpp-context-listing-courtscheduler's
# docker/.env + AzuriteFixture.
AZURITE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1; # gitleaks:allow
